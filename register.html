<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trashcore Bot Registration | Secure Access Control</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bungee&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0b0a;
      --bg-panel: #16150f;
      --bg-panel-2: #1e1c14;
      --input-bg: #1a180f;
      --ink: #eae6da;
      --ink-dim: #9c9787;
      --toxic: #b6ff3c;
      --toxic-dim: #7fbf1e;
      --spray: #ff3d81;
      --caution: #ffb703;
      --rust: #d4552b;
      --success: #b6ff3c;
      --error: #ff3d81;
      --line: #34322a;
      --font-display: 'Bungee', system-ui, sans-serif;
      --font-mono: 'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.001ms !important;
      }
    }

    body {
      background: var(--bg);
      font-family: var(--font-mono);
      color: var(--ink);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
      line-height: 1.5;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at 15% 25%, rgba(182,255,60,0.06) 0%, transparent 40%),
        radial-gradient(circle at 85% 75%, rgba(255,61,129,0.05) 0%, transparent 45%);
      pointer-events: none;
      z-index: 0;
    }

    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        to bottom,
        rgba(255,255,255,0.02) 0px,
        rgba(255,255,255,0.02) 1px,
        transparent 1px,
        transparent 3px
      );
      mix-blend-mode: overlay;
      pointer-events: none;
      z-index: 0;
    }

    .hazard-strip {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 5px;
      background: repeating-linear-gradient(
        135deg, var(--caution), var(--caution) 12px, #0b0b0a 12px, #0b0b0a 24px
      );
      z-index: 20;
    }

    :focus-visible { outline: 2px solid var(--toxic); outline-offset: 2px; }

    .container {
      background: var(--bg-panel);
      padding: 28px 22px 24px;
      border-radius: 10px;
      width: 94%;
      max-width: 420px;
      box-shadow: 0 12px 36px rgba(0,0,0,0.55);
      text-align: center;
      border: 1px solid var(--line);
      position: relative;
      z-index: 1;
      margin: 16px;
    }

    .container::before {
      content: '';
      position: absolute;
      top: 0; left: 0; width: 100%; height: 4px;
      background: repeating-linear-gradient(
        135deg, var(--caution), var(--caution) 8px, var(--bg-panel) 8px, var(--bg-panel) 16px
      );
      border-radius: 10px 10px 0 0;
    }

    .main-title {
      font-family: var(--font-display);
      font-size: 1.15rem;
      font-weight: 400;
      margin: 0.6rem 0 0.6rem;
      color: var(--toxic);
      letter-spacing: 0.01em;
    }

    h2 {
      margin: 0 0 20px;
      color: var(--ink);
      font-size: 0.9rem;
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    input {
      width: 100%;
      padding: 15px;
      border-radius: 6px;
      margin-bottom: 16px;
      font-size: 0.95rem;
      font-family: var(--font-mono);
      background: var(--input-bg);
      color: var(--ink);
      border: 1px solid var(--line);
      outline: none;
      transition: all 0.25s ease;
      font-weight: 500;
    }

    input::placeholder { color: var(--ink-dim); }

    input:focus {
      border-color: var(--toxic);
      box-shadow: 0 0 0 3px rgba(182,255,60,0.15);
    }

    button {
      width: 100%;
      padding: 15px;
      border-radius: 6px;
      background: var(--toxic);
      color: #0b0b0a;
      font-family: var(--font-mono);
      font-size: 0.9rem;
      font-weight: 800;
      cursor: pointer;
      border: none;
      transition: all 0.2s ease;
      letter-spacing: 0.02em;
    }

    button:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(182,255,60,0.25);
    }

    button:active:not(:disabled) { transform: translateY(0); }

    button:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

    .result-box {
      margin-top: 18px;
      padding: 18px;
      border-radius: 6px;
      background: var(--bg-panel-2);
      display: none;
      text-align: left;
      border: 1px solid var(--line);
      font-size: 0.88rem;
    }

    .key {
      font-size: 1rem;
      font-weight: 700;
      color: var(--toxic);
      background: rgba(182,255,60,0.08);
      padding: 12px;
      border-radius: 5px;
      font-family: var(--font-mono);
      display: block;
      letter-spacing: 0.03em;
      margin: 10px 0;
      word-break: break-all;
      text-align: center;
      border: 1px dashed var(--toxic-dim);
    }

    .verify-btn {
      background: transparent;
      border: 1px solid var(--spray);
      color: var(--spray);
      margin-top: 14px;
      width: 100%;
      padding: 13px;
      font-size: 0.85rem;
      border-radius: 6px;
    }

    .verify-btn:hover:not(:disabled) {
      background: var(--spray);
      color: #fff;
      box-shadow: 0 6px 18px rgba(255,61,129,0.25);
    }

    #statsBox {
      margin-top: 22px;
      background: var(--bg-panel-2);
      padding: 16px;
      border-radius: 6px;
      border: 1px solid var(--line);
      display: none;
      text-align: left;
      font-size: 0.88rem;
    }

    #statsBox h3 {
      margin: 0 0 10px;
      color: var(--toxic);
      font-weight: 700;
      font-size: 0.85rem;
      letter-spacing: 0.03em;
    }

    .loading {
      width: 20px;
      height: 20px;
      border: 3px solid rgba(182,255,60,0.25);
      border-radius: 50%;
      border-top-color: var(--toxic);
      animation: spin 1s linear infinite;
      display: inline-block;
      margin-right: 10px;
      vertical-align: middle;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .sitefoot {
      position: absolute;
      bottom: 16px;
      width: 100%;
      text-align: center;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      z-index: 10;
      pointer-events: none;
      color: var(--ink-dim);
    }

    .sitefoot .glow {
      color: var(--toxic);
    }

    @media (max-width: 480px) {
      .container { width: 96%; padding: 24px 18px; }
      .main-title { font-size: 1.02rem; }
      h2 { font-size: 0.85rem; }
      input, button { padding: 16px; font-size: 0.95rem; }
      .key { font-size: 0.95rem; padding: 12px 10px; }
      body { padding: 10px 0; }
    }

    @media (max-width: 390px) {
      input, button { padding: 16px 14px; }
    }
  </style>
</head>
<body>
  <div class="hazard-strip"></div>

  <div class="container">
    <h1 class="main-title">TRASHCORE_ API KEY GENERATOR</h1>
    <h2>Register Your Number</h2>

    <input
      type="tel"
      id="number"
      placeholder="e.g., +254712345678"
      autocomplete="tel"
      inputmode="tel"
    >

    <button onclick="registerNumber()">Generate Trash-Key</button>

    <button onclick="regenerateKey()" style="margin-top:10px;">
      Regenerate Lost Key
    </button>

    <div class="result-box" id="resultBox">
      <div id="resultText"></div>
      <button class="verify-btn" id="verifyBtn" style="display:none;">Verify Key</button>
    </div>

    <div id="statsBox">
      <h3>Live Stats</h3>
      <p id="statsText">Loading...</p>
    </div>
  </div>

  <footer class="sitefoot">
    <span class="glow">©️ 2025 Trashcore Devs • Secure Bot Infrastructure</span>
  </footer>

  <script>
    const API_URL = "https://registration-backend-d7r8.onrender.com";

    async function registerNumber() {
      const num = document.getElementById("number").value.trim();
      const resultBox = document.getElementById("resultBox");
      const resultText = document.getElementById("resultText");
      const verifyBtn = document.getElementById("verifyBtn");

      if (!num || num.length < 6) {
        alert("⚠️ Enter a valid number with country code (e.g., +254712345678)");
        return;
      }

      resultBox.style.display = "block";
      resultText.innerHTML = `<div class="loading"></div> Processing your request...`;

      try {
        const res = await fetch(`${API_URL}/register`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ number: num })
        });

        if (!res.ok) throw new Error(`HTTP ${res.status}`);

        const data = await res.json();

        if (!data.status) {
          resultText.innerHTML = `<span style="color:var(--error); font-weight:600;">❌ ${data.msg}</span>`;
          verifyBtn.style.display = "none";
          return;
        }

        resultText.innerHTML = `
          <span style="color:var(--success); font-weight:700;">✔ Success!</span><br><br>
          Your unique <b>Trash-Key</b>:<br>
          <span class="key">${data.key}</span><br>
          <small>📋 Copy & save this — you’ll need it to pair with the bot.</small>
        `;

        verifyBtn.style.display = "block";
        verifyBtn.onclick = () => {
          window.location.href = `${API_URL}/verify/${data.key}`;
        };

      } catch (e) {
        console.error("Registration error:", e);
        resultText.innerHTML = `<span style="color:var(--error); font-weight:600;">❌ Connection failed</span><br><small>Check network or try again.</small>`;
        verifyBtn.style.display = "none";
      }
    }

    async function regenerateKey() {
      const num = document.getElementById("number").value.trim();
      const resultBox = document.getElementById("resultBox");
      const resultText = document.getElementById("resultText");
      const verifyBtn = document.getElementById("verifyBtn");

      if (!num) {
        alert("Enter the number used before.");
        return;
      }

      resultBox.style.display = "block";
      resultText.innerHTML = `<div class="loading"></div> Checking...`;

      try {
        const res = await fetch(`${API_URL}/regenerate`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ number: num })
        });

        const data = await res.json();

        if (!data.status) {
          resultText.innerHTML = `<span style="color:var(--error); font-weight:600;">❌ ${data.msg}</span>`;
          verifyBtn.style.display = "none";
          return;
        }

        resultText.innerHTML = `
          <span style="color:var(--success); font-weight:700;">✔ New Key Generated!</span><br><br>
          Your new <b>Trash-Key</b>:<br>
          <span class="key">${data.key}</span><br>
          <small>📋 Save this one carefully!</small>
        `;

        verifyBtn.style.display = "block";
        verifyBtn.onclick = () => window.location.href = `${API_URL}/verify/${data.key}`;

      } catch (e) {
        resultText.innerHTML = `<span style="color:var(--error); font-weight:600;">❌ Server offline</span>`;
        verifyBtn.style.display = "none";
      }
    }

    async function loadStats() {
      const statsBox = document.getElementById("statsBox");
      const statsText = document.getElementById("statsText");

      try {
        const res = await fetch(`${API_URL}/stats`);
        const data = await res.json();

        if (data.status) {
          statsBox.style.display = "block";
          statsText.innerHTML = `
            <b>Users:</b> ${data.total}<br>
            <b>✅ Verified:</b> <span style="color:var(--success);">${data.verified}</span><br>
            <b>⏳ Pending:</b> <span style="color:var(--error);">${data.nonVerified}</span>
          `;
        } else {
          statsText.textContent = "Unavailable";
        }
      } catch (e) {
        statsText.textContent = "Offline";
      }
    }

    document.addEventListener('DOMContentLoaded', loadStats);
  </script>
</body>
</html>
